name: Build Image

# Builds the container images into this repository's own GHCR namespace
# (ghcr.io/<owner>/karakeep).
#
# The upstream docker.yml workflow pushes to the project's own org namespaces
# (ghcr.io/hoarder-app and ghcr.io/karakeep-app) with a PAT that only the
# maintainers have, so it can't run from a fork. This workflow covers the fork
# case: it uses the built-in GITHUB_TOKEN, which can publish to the fork's own
# packages.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to build"
        type: choice
        options:
          - aio
          - web
          - workers
          - cli
          - mcp
        default: aio
      tag:
        description: "Image tag"
        required: false
        default: latest
      arch:
        description: "Which architectures to build"
        type: choice
        options:
          - amd64
          - arm64
          - both
        default: both

permissions:
  contents: read
  packages: write

jobs:
  # Turns the 'arch' input into the build matrix. A job level 'if' can't see
  # the matrix context, so the matrix has to be built from the input instead
  # of filtering the matrix afterwards.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      multi: ${{ steps.plan.outputs.multi }}
    steps:
      - id: plan
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64)
              echo 'matrix=[{"arch":"amd64","os":"ubuntu-latest"}]' >>"$GITHUB_OUTPUT"
              echo 'multi=false' >>"$GITHUB_OUTPUT"
              ;;
            arm64)
              echo 'matrix=[{"arch":"arm64","os":"ubuntu-24.04-arm"}]' >>"$GITHUB_OUTPUT"
              echo 'multi=false' >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix=[{"arch":"amd64","os":"ubuntu-latest"},{"arch":"arm64","os":"ubuntu-24.04-arm"}]' >>"$GITHUB_OUTPUT"
              echo 'multi=true' >>"$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to Github Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is built on a native runner, so no emulation is
      # needed. The manifest job below stitches them together.
      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/karakeep
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            SERVER_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.target }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ inputs.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}-${{ matrix.arch }}

      # With a single architecture there's no manifest to stitch together, so
      # the plain tags are pointed at it directly.
      - name: Point the plain tags at the single architecture
        if: ${{ needs.plan.outputs.multi != 'true' }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/karakeep
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.target }}" \
            "${IMAGE}:${{ inputs.target }}-${{ matrix.arch }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.tag }}" \
            "${IMAGE}:${{ inputs.target }}-${{ matrix.arch }}"

  manifest:
    needs: [plan, build]
    # Only makes sense when both architectures were built.
    if: ${{ needs.plan.outputs.multi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to Github Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/karakeep
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.target }}" \
            "${IMAGE}:${{ inputs.target }}-amd64" \
            "${IMAGE}:${{ inputs.target }}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.tag }}" \
            "${IMAGE}:${{ inputs.target }}-amd64" \
            "${IMAGE}:${{ inputs.target }}-arm64"
